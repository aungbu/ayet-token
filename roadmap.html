<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>AYET ロードマップ | Roadmap</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap');
:root{--bg:#07120c;--bg2:#0a1a10;--panel:#0d2113;--line:#194a2a;--grn:#02834a;--grn2:#1fc46e;--gold:#f5c451;--ink:#eafff1;--mut:#7da890;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
h1,h2{font-weight:900;line-height:1.1}
nav{position:sticky;top:0;z-index:50;background:rgba(7,18,12,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.logo span{font-weight:900;font-size:17px}
.nav-right{display:flex;gap:16px;align-items:center}
.nav-right a{font-size:14px;color:var(--mut)}
.nav-right a:hover{color:var(--grn2)}
.langtog{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit}
.langtog:hover{border-color:var(--grn)}
.head{padding:64px 0 36px;position:relative;overflow:hidden}
.head::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 80% 0%,rgba(2,131,74,.18),transparent 60%);z-index:0}
.head-in{position:relative;z-index:2}
.eyebrow{color:var(--grn2);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;font-weight:700}
.head h1{font-size:clamp(34px,6vw,60px);margin-bottom:16px}
.head p{color:var(--mut);font-size:16px;line-height:1.7;max-width:640px}
.road{position:relative;padding:30px 0 50px;margin-left:8px}
.road::before{content:"";position:absolute;left:7px;top:18px;bottom:30px;width:2px;background:linear-gradient(var(--grn),var(--gold))}
.ritem{position:relative;padding-left:34px;margin-bottom:30px}
.ritem::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;background:var(--grn2);box-shadow:0 0 0 5px rgba(31,196,110,.15)}
.ritem .date{color:var(--gold);font-weight:900;font-size:15px;margin-bottom:6px}
.ritem .title{font-size:18px;font-weight:700;margin-bottom:6px}
.ritem .txt{color:var(--mut);font-size:14.5px;line-height:1.65}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:36px 0;text-align:center;color:var(--mut);font-size:13px;margin-top:20px}
footer a{color:var(--grn2)}
@media(max-width:820px){.ritem .title{font-size:16px}}
</style>
</head>
<body>
<nav>
  <div class="wrap nav-in">
    <a class="logo" href="/"><img src="/assets/ayetLogo.JPG" alt="AYET"><span>AYET</span></a>
    <div class="nav-right">
      <a href="/" data-i18n="nav_home">ホーム</a>
      <a href="/tokenomics/" data-i18n="nav_tknm">トークノミクス</a>
      <button class="langtog" id="langBtn">EN</button>
    </div>
  </div>
</nav>
<header class="head">
  <div class="wrap head-in">
    <div class="eyebrow" data-i18n="eyebrow">ロードマップ</div>
    <h1 data-i18n="title">AYET ロードマップ</h1>
    <p data-i18n="intro">プレスリリースからプラットフォーム開発、国内外上場、新ユニット始動まで。AYETプロジェクトのこれまでとこれから。</p>
  </div>
</header>
<div class="wrap"><div class="road" id="roadList"></div></div>
<footer>
  <span data-i18n="disc">本資料は情報提供を目的としており、投資勧誘を目的とするものではありません。</span><br>
  © 2026 株式会社AKBT · <a href="/">AYET on NCK Network</a>
</footer>
<script>
"use strict";
var lang="ja";
function $(id){return document.getElementById(id);}
var T={
ja:{nav_home:"ホーム",nav_tknm:"トークノミクス",eyebrow:"ロードマップ",title:"AYET ロードマップ",
intro:"プレスリリースからプラットフォーム開発、国内外上場、新ユニット始動まで。AYETプロジェクトのこれまでとこれから。",
disc:"本資料は情報提供を目的としており、投資勧誘を目的とするものではありません。"},
en:{nav_home:"Home",nav_tknm:"Tokenomics",eyebrow:"Roadmap",title:"AYET Roadmap",
intro:"From press release to platform development, domestic and global listings, and the debut of a new unit — the past and future of the AYET project.",
disc:"This material is for informational purposes only and does not constitute investment solicitation."}
};
var ROAD=[
{ja:{d:"2025年11月",h:"プレスリリース",t:"本プロジェクト始動に関するプレスリリースを発表。"},en:{d:"Nov 2025",h:"Press Release",t:"Press release announcing the launch of the project."}},
{ja:{d:"2026年1月〜",h:"プロジェクト始動 / プラットフォーム開発",t:"本プロジェクト正式始動。各種機能および関連プラットフォームの開発を開始。"},en:{d:"From Jan 2026",h:"Launch / Platform Development",t:"Official launch; development of features and related platforms begins."}},
{ja:{d:"2026年6月〜",h:"プロ向け販売",t:"日本国内での適格機関投資家向け販売（プロ向け販売）を計画し実施。"},en:{d:"From Jun 2026",h:"Professional Sale",t:"Domestic sale to qualified institutional (professional) investors, planned and executed."}},
{ja:{d:"2026〜2027年内",h:"国内上場",t:"国内取引所上場（国内IEO またはリスティング）を実施予定。"},en:{d:"2026–2027",h:"Domestic Listing",t:"Domestic exchange listing (IEO or listing) planned."}},
{ja:{d:"2026〜2027年内",h:"グローバル上場",t:"海外取引所上場（海外IEO またはリスティング）を実施予定。"},en:{d:"2026–2027",h:"Global Listing",t:"Overseas exchange listing (IEO or listing) planned."}},
{ja:{d:"2026〜2027年内",h:"新ユニット始動 / マーケットプレイス決済",t:"新ユニット活動開始・選抜企画への参画。日本直販等と連携したマーケットプレイスでAYET決済を開始。"},en:{d:"2026–2027",h:"New Unit / Marketplace Payments",t:"New unit debuts; AYET payments go live in the Nippon Direct Sales–linked marketplace."}}
];
function renderRoad(){var g=$("roadList");g.innerHTML="";ROAD.forEach(function(r){var d=r[lang];var e=document.createElement("div");e.className="ritem";e.innerHTML="<div class='date'>"+d.d+"</div><div class='title'>"+d.h+"</div><div class='txt'>"+d.t+"</div>";g.appendChild(e);});}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-i18n]").forEach(function(el){var k=el.getAttribute("data-i18n");if(T[lang][k]!==undefined)el.textContent=T[lang][k];});$("langBtn").textContent=lang==="ja"?"EN":"日本語";renderRoad();}
$("langBtn").addEventListener("click",function(){lang=lang==="ja"?"en":"ja";applyLang();});
applyLang();
</script>
</body>
</html>
